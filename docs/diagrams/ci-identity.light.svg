<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1100 262" role="img" aria-label="How a workflow gets AWS credentials: GitHub issues an OIDC token whose subject names the repository by immutable ID and the environment; STS only exchanges it for the matching role." xmlns="http://www.w3.org/2000/svg" width="1100" height="262"><style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .d-text{fill:#151a22} .d-muted{fill:#5d6878} .d-mono{fill:#3c4656;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace} .d-edge{fill:#3c4656;font-weight:600} .d-labelbg{fill:#ffffff} .d-line{stroke:#3c4656} .d-arrowhead{fill:#3c4656} .d-arrowhead-accent{fill:#E8590C} .d-box{fill:#ffffff;stroke:#d5dbe3} .d-note{fill:#eef1f5;stroke:#d5dbe3} .d-abbr{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;letter-spacing:.02em}</style><rect x="0" y="0" width="1100" height="262" rx="10" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead"/></marker><marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead-accent"/></marker><marker id="as-accent" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="d-arrowhead-accent"/></marker></defs><rect x="20" y="40" width="210" height="96" rx="6" class="d-box" stroke-width="1.4"/>
<text x="125.0" y="58" font-size="12" text-anchor="middle" font-weight="700" class="d-text">GitHub job</text>
<text x="125.0" y="74" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">environment: development</text>
<text x="125.0" y="88" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">permissions:</text>
<text x="125.0" y="102" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">id-token: write</text>
<rect x="270" y="30" width="300" height="116" rx="6" class="d-box" stroke-width="1.4"/>
<text x="420.0" y="48" font-size="12" text-anchor="middle" font-weight="700" class="d-text">OIDC token claims</text>
<text x="420.0" y="64" font-size="10.5" text-anchor="middle" font-weight="400" class="d-mono">aud = sts.amazonaws.com</text>
<text x="420.0" y="78" font-size="10.5" text-anchor="middle" font-weight="400" class="d-mono">sub = repo:maga-zargaryan@68907676/</text>
<text x="420.0" y="92" font-size="10.5" text-anchor="middle" font-weight="400" class="d-mono">platform-infra@1385198957:</text>
<text x="420.0" y="106" font-size="10.5" text-anchor="middle" font-weight="400" class="d-mono">environment:development</text>
<rect x="610" y="40" width="170" height="96" rx="6" class="d-box" stroke-width="1.4"/>
<text x="695.0" y="58" font-size="12" text-anchor="middle" font-weight="700" class="d-text">AWS STS</text>
<text x="695.0" y="74" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">AssumeRoleWith-</text>
<text x="695.0" y="88" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">WebIdentity</text>
<text x="695.0" y="102" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">StringEquals on aud + sub</text>
<rect x="820" y="20" width="260" height="136" rx="6" stroke="#E8590C" fill="#E8590C" fill-opacity="0.08" stroke-width="1.4"/>
<text x="950.0" y="38" font-size="12" text-anchor="middle" font-weight="700" class="d-text">github-actions-platform_dev</text>
<text x="950.0" y="54" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">ReadOnlyAccess (AWS managed)</text>
<text x="950.0" y="68" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">terraform-state (own key only)</text>
<text x="950.0" y="82" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">github-actions-deploy-platform</text>
<text x="950.0" y="96" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">max session 1 h</text>
<polyline points="230,88 268,88" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="570,88 608,88" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<polyline points="780,88 818,88" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="747.0" y="69" width="104.0" height="16" rx="3" class="d-labelbg"/>
<text x="799" y="80" font-size="10.5" text-anchor="middle" font-weight="400" class="d-edge">1 h credentials</text>
<rect x="820" y="180" width="260" height="70" rx="6" class="d-box" stroke-width="1.4"/>
<text x="950.0" y="198" font-size="12" text-anchor="middle" font-weight="700" class="d-text">Roles it creates</text>
<text x="950.0" y="214" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">must carry java-platform-</text>
<text x="950.0" y="228" font-size="10.5" text-anchor="middle" font-weight="400" class="d-muted">permissions-boundary</text>
<polyline points="950,156 950,178" fill="none" class="d-line" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="20" y="170" width="760" height="80" rx="5" class="d-note"/>
<text x="28" y="186" font-size="10.5" text-anchor="start" font-weight="400" class="d-muted">Pinning the numeric owner and repository IDs means a renamed or recreated repository cannot assume the role.</text>
<text x="28" y="200" font-size="10.5" text-anchor="start" font-weight="400" class="d-muted">Pinning the GitHub Environment means only jobs that declare that environment get credentials;</text>
<text x="28" y="214" font-size="10.5" text-anchor="start" font-weight="400" class="d-muted">apply environments accept deployments from protected main only, and production needs an approval.</text></svg>
